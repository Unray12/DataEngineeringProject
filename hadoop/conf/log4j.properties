# Logging configuration shared by the HDFS daemons.
#
# HADOOP_CONF_DIR points at this directory, so Hadoop picks this file up instead
# of the one shipped in the image. It keeps the daemons at INFO (enough to follow
# a failure) while dropping Hadoop's per-command classpath dump, which is a
# single enormous line that buries everything else in `docker compose logs`.

log4j.rootLogger=INFO, console

log4j.appender.console=org.apache.log4j.ConsoleAppender
log4j.appender.console.target=System.err
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.ConversionPattern=%d{ISO8601} %-5p %c{1} - %m%n

# Shell logs the full classpath of every hdfs invocation at INFO.
log4j.logger.org.apache.hadoop.util.Shell=ERROR
log4j.logger.org.apache.hadoop.hdfs.tools.DFSck=WARN
log4j.logger.org.apache.hadoop.hdfs.server.namenode.NameNodeRetryCache=ERROR