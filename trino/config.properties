# Server-wide Trino configuration.
# The Iceberg catalogs live in trino/catalog/*.properties.

coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# Single node: keep concurrency modest so the whole stack fits in ~12 GB.
query.max-memory=3GB
query.max-memory-per-node=1GB
query.max-total-memory=4GB
query.max-execution-time=30m
memory.heap-headroom-per-node=512MB
