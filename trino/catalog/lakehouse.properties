# Iceberg tables in the lakehouse.
#
# The catalog is the Hive Metastore: Spark writes Iceberg metadata, Trino reads
# it via `iceberg.catalog.type=hive_metastore`. HDFS client settings are passed
# to Trino by pointing it at the shared Hadoop configuration files (Trino does
# not read HADOOP_CONF_DIR by itself).
connector.name=iceberg
iceberg.catalog.type=hive_metastore

# Hive Metastore (shared catalog)
hive.metastore.uri=thrift://hive-metastore:9083

# HDFS (shared storage): reuse the same core-site.xml/hdfs-site.xml as Spark and
# the Hive Metastore. Mounted read-only at /etc/hadoop/conf by docker-compose.
hive.config.resources=/etc/hadoop/conf/core-site.xml,/etc/hadoop/conf/hdfs-site.xml

# Iceberg write/read behaviour
iceberg.file-format=PARQUET
iceberg.compression-codec=SNAPPY
