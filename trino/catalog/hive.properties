# Plain Hive/Parquet tables, used only by benchmark #3 (Iceberg vs Hive/Parquet).
# Same Hive Metastore and HDFS as the Iceberg catalog; nothing in the platform reads it.
connector.name=hive
hive.metastore.uri=thrift://hive-metastore:9083
hive.config.resources=/etc/hadoop/conf/core-site.xml,/etc/hadoop/conf/hdfs-site.xml
hive.storage-format=PARQUET
hive.compression-codec=SNAPPY
hive.non-managed-table-writes-enabled=true
# Schema changes are off by default; benchmark #3 compares them with Iceberg's, so allow them.
hive.allow-add-column=true
hive.allow-rename-column=true
hive.allow-drop-table=true
